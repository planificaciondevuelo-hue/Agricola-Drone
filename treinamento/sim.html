<!-- O campo: o simulador de voo roda inteiro aqui dentro, sem alteração. -->
<iframe id="campo" src="campo/index.html?v=62025a89c272" allow="xr-spatial-tracking; fullscreen; accelerometer; gyroscope" allowfullscreen title="Campo de treinamento"></iframe>

<!-- O controle de verdade: aparece quando o aluno escolhe a vista Controle.
     É o mesmo site do RC Plus, com as telas do app Agras funcionando. -->
<div class="aparelho esconder" id="aparelho">
  <iframe id="controle" src="about:blank" title="Controle RC Plus"></iframe>
</div>

<!-- ------------------------------------------------------------ carregando -->
<div class="carregando" id="carregando">
  <div class="carregando__caixa">
    <p class="olho">Preparando o campo</p>
    <h2 id="carregando-titulo">Carregando</h2>
    <p id="carregando-passo">Montando o terreno, a lavoura e a aeronave…</p>
    <a id="carregando-voltar" class="esconder" href="conta/drones.html">Voltar à escolha do drone</a>
  </div>
</div>

<!-- --------------------------------------------------------- a instrução -->
<aside class="guia" id="guia" hidden>
  <header class="guia__topo">
    <a class="guia__voltar" href="index.html" title="Voltar ao painel">←</a>
    <div class="guia__titulos">
      <p class="olho" id="guia-etapa">Etapa</p>
      <h1 id="guia-titulo">—</h1>
    </div>
    <button class="guia__recolher" type="button" id="btn-recolher" title="Recolher">−</button>
  </header>

  <div class="guia__corpo" id="guia-corpo">
    <p class="guia__instrucao" id="guia-instrucao"></p>

    <ul class="lista" id="guia-conferir"></ul>

    <details class="guia__porque">
      <summary>Por que isso importa</summary>
      <p id="guia-porque"></p>
    </details>
  </div>

  <button class="guia__concluir esconder" type="button" id="btn-concluir">
    Concluir etapa
  </button>
</aside>

<!-- -------------------------------------------------------------- boletim -->
<div class="modal esconder" id="modal">
  <div class="modal__caixa">
    <p class="olho">Etapa concluída</p>
    <h2 id="modal-titulo">Boletim</h2>
    <div id="modal-corpo"></div>
    <div class="modal__botoes">
      <a class="botao-grande" id="btn-proxima" href="#">Próxima etapa</a>
      <a class="botao-linha" href="index.html">Voltar ao painel</a>
    </div>
  </div>
</div>
